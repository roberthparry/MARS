<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650" role="img" aria-labelledby="title desc">
  <title id="title">Relation between geographic latitude and the altitude of the celestial pole</title>
  <desc id="desc">Geometric construction showing the Earth's rotation axis, equatorial plane, local horizon, zenith, celestial equator, and north celestial pole.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d8e3df"/>
    </marker>
    <marker id="small-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d8e3df"/>
    </marker>
    <style>
      .line, .earth, .angle, .star {
        fill: none;
        stroke: #d8e3df;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line { stroke-width: 3.2; }
      .earth { stroke-width: 4.1; }
      .angle { stroke-width: 2.4; }
      .label, .math {
        fill: #e6edf3;
        font-family: Georgia, "Times New Roman", serif;
      }
      .label { font-size: 27px; font-weight: 600; }
      .math { font-size: 29px; font-style: italic; }
      .angle-label { font-size: 25px; }
      .sub { font-size: 18px; }
    </style>
  </defs>

  <!-- Spherical Earth section and its rotation axis. -->
  <path class="earth" d="M155 145 C302 145 445 222 548 366 C603 444 618 516 618 590"/>
  <path class="line" d="M155 590 L155 25" marker-end="url(#arrow)"/>
  <path class="line" d="M25 590 L760 590"/>

  <!-- Local vertical, pole, celestial equator, object, and horizon. -->
  <path class="line" d="M155 590 L548 366 L716 270" marker-end="url(#arrow)"/>
  <path class="line" d="M548 366 L548 188" marker-end="url(#arrow)"/>
  <path class="line" d="M548 366 L748 366" marker-end="url(#arrow)"/>
  <path class="line" d="M548 366 L758 318"/>
  <path class="line" d="M431 169 L548 366 L626 499"/>

  <!-- Angular measures. -->
  <path class="angle" d="M240 590 A85 85 0 0 0 228.6 547.5"/>
  <path class="angle" d="M548 291 A75 75 0 0 0 509.7 301.5"/>
  <path class="angle" d="M608.2 330.1 A70 70 0 0 1 616.3 350.4" marker-end="url(#small-arrow)"/>
  <path class="angle" d="M635.8 346.1 A90 90 0 0 1 592.8 443.5" marker-end="url(#small-arrow)"/>

  <!-- Celestial object. -->
  <path class="star" stroke-width="3" d="M768 304 L772 315 L784 315 L774 322 L778 334 L768 327 L758 334 L762 322 L752 315 L764 315 Z"/>

  <!-- Labels follow the positions in the original figure. -->
  <text class="label" x="28" y="390">Earth's</text>
  <text class="label" x="28" y="421">axis of</text>
  <text class="label" x="28" y="452">rotation</text>

  <text class="label" x="590" y="135" text-anchor="middle">North celestial</text>
  <text class="label" x="590" y="166" text-anchor="middle">pole</text>
  <text class="label" x="727" y="276">Zenith</text>
  <text class="label" x="770" y="375">Plane of celestial equator</text>
  <text class="label" x="650" y="513">Plane of horizon</text>
  <text class="label" x="255" y="632">Plane of Earth's equator</text>

  <text class="math" x="255" y="575">&#966;<tspan class="sub" baseline-shift="sub">0</tspan></text>
  <text class="math" x="515" y="272">&#966;<tspan class="sub" baseline-shift="sub">0</tspan></text>
  <text class="math angle-label" x="642" y="337">z</text>
  <text class="math" x="637" y="416">a</text>
</svg>
