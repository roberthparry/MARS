<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="785" viewBox="0 0 1075 785" role="img" aria-labelledby="title desc">
  <title id="title">Equatorial and ecliptic reference planes</title>
  <desc id="desc">Centerline tracing of the original celestial-sphere construction.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .main, .fine, .angle, .symbol {
        fill: none;
        stroke: #d8e3df;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .main { stroke-width: 4.2; }
      .fine { stroke-width: 2.7; }
      .angle { stroke-width: 2.4; }
      .back { fill: none; stroke: #8b9996; stroke-width: 2.3; stroke-linecap: round; }
      .front { fill: none; stroke: #d8e3df; stroke-width: 4.2; stroke-linecap: round; }
      .guide { stroke-dasharray: 8 7; }
      .label, .math {
        fill: #e6edf3;
        font-family: Georgia, "Times New Roman", serif;
      }
      .label { font-size: 28px; font-weight: 600; }
      .math { font-size: 30px; font-style: italic; }
      .sub { font-size: 20px; }
    </style>
    <marker id="arrow" markerWidth="17" markerHeight="14" refX="15" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L15 7 L0 14 Z" fill="#d8e3df"/>
    </marker>
    <marker id="small-arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L11 5 L0 10 Z" fill="#d8e3df"/>
    </marker>
  </defs>

  <rect class="bg" width="1075" height="785"/>

  <!-- Least-squares circle fitted to the source sphere. -->
  <circle class="main" cx="585.981" cy="424.461" r="338.711"/>

  <!-- Ellipses fitted through the measured common equinox (497, 578). -->
  <g transform="translate(585.981 424.461) rotate(3.39)">
    <path class="back" d="M-338.711 0 A338.711 163.118 0 0 1 338.711 0"/>
    <path class="front" d="M-338.711 0 A338.711 163.118 0 0 0 338.711 0"/>
  </g>
  <g transform="translate(585.981 424.461) rotate(-20.80)">
    <path class="back" d="M-338.711 0 A338.711 122.517 0 0 1 338.711 0"/>
    <path class="front" d="M-338.711 0 A338.711 122.517 0 0 0 338.711 0"/>
  </g>
  <g transform="translate(585.981 424.461) rotate(95.39)">
    <path class="back" d="M-338.711 0 A338.711 84.330 0 0 1 338.711 0"/>
    <path class="front" d="M-338.711 0 A338.711 84.330 0 0 0 338.711 0"/>
  </g>

  <!-- Reference axes. -->
  <path class="main" d="M586 102 L585.981 424.461"/>
  <path class="main" d="M452 119 L585.981 424.461"/>
  <path class="main" d="M585.981 424.461 L497 578"/>
  <path class="main" d="M585.981 424.461 L926 456"/>
  <path class="main" d="M585.981 424.461 L904 320"/>

  <!-- Direction to the body and its projections. -->
  <path class="main" d="M585.981 424.461 L686 239" marker-end="url(#arrow)"/>
  <path class="fine" d="M696 251 A679.949 679.949 0 0 1 829 420" marker-start="url(#small-arrow)"/>
  <path class="fine" d="M689 252 C720 320 744 438 748.427 565.729" marker-start="url(#small-arrow)"/>
  <path class="symbol" stroke-width="3.2" d="M686 224
    L690 235 L702 235 L692 242 L696 254 L686 247
    L676 254 L680 242 L670 235 L682 235 Z"/>

  <!-- Angular measures, traced as centerline arcs. -->
  <path class="angle" d="M452 117 C492 99 547 99 584 104" marker-end="url(#small-arrow)"/>
  <path class="angle" d="M681 432 C681 418 679 405 674 395.55" marker-end="url(#small-arrow)"/>
  <path class="angle" d="M502.339 568.788 A318.388 115.166 -20.80 0 0 817.746 427.020" marker-end="url(#small-arrow)"/>
  <path class="angle" d="M501.449 570.327 A321.775 154.962 3.39 0 0 748.427 565.729" marker-end="url(#small-arrow)"/>

  <!-- Original label positions. -->
  <text class="label" x="249" y="110">Pole of ecliptic</text>
  <text class="math" x="585" y="64">z<tspan class="sub" baseline-shift="sub">1</tspan></text>
  <text class="label" x="638" y="57">Pole of plane <tspan class="math">O</tspan><tspan class="math sub" baseline-shift="sub">x1 y1</tspan>, equator</text>
  <text class="math" x="423" y="150">z<tspan class="sub" baseline-shift="sub">2</tspan></text>
  <text class="math" x="518" y="132">ε</text>

  <text class="label" x="76" y="439">Equator of <tspan class="math">z</tspan><tspan class="math sub" baseline-shift="sub">1</tspan></text>
  <text class="label" x="167" y="573">Ecliptic</text>
  <text class="label" x="326" y="635">Equinox</text>
  <path class="symbol" stroke-width="2.5" transform="translate(12 3) translate(443 619) scale(.8) translate(-443 -619)" d="M443 632 L443 616
    M443 616 C441 608 435 604 429 606 C423 608 421 613 423 619
    M443 616 C445 608 451 604 457 606 C463 608 465 613 463 619"/>

  <text class="math" x="512" y="620">x<tspan class="sub" baseline-shift="sub">1</tspan> = x<tspan class="sub" baseline-shift="sub">2</tspan></text>
  <text class="math" x="545" y="651">=</text>
  <path class="symbol" stroke-width="2.5" transform="translate(10 9) translate(592 638) scale(.8) translate(-592 -638)" d="M592 651 L592 635
    M592 635 C590 627 584 623 578 625 C572 627 570 632 572 638
    M592 635 C594 627 600 623 606 625 C612 627 614 632 612 638"/>
  <text class="math" x="550" y="451">O</text>
  <text class="math" x="934" y="468">y<tspan class="sub" baseline-shift="sub">1</tspan></text>
  <text class="math" x="925" y="342">y<tspan class="sub" baseline-shift="sub">2</tspan></text>

  <text class="math" x="684" y="421">ε</text>
  <text class="math" x="742" y="423">δ</text>
  <text class="math" x="781" y="345">β</text>
  <text class="math" x="672" y="497">λ</text>
  <text class="math" x="648" y="569">α</text>
</svg>
