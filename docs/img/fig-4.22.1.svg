<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="663" height="532" viewBox="0 0 663 532" role="img" aria-labelledby="fig4221-title fig4221-desc">
  <title id="fig4221-title">Reference ellipsoid geometry</title>
  <desc id="fig4221-desc">A reference ellipsoid meridian section showing the axis of rotation, equator, geocentric radius, geodetic normal, tangent at p prime, and the geocentric and geodetic latitude angles.</desc>
  <defs>
    <style>
      .line { fill: none; stroke: #e8efe9; stroke-linecap: round; stroke-linejoin: round; }
      .main { stroke-width: 2.6; }
      .thin { stroke-width: 1.8; }
      .label { fill: #f3f8f4; font-family: "Liberation Serif", "Times New Roman", serif; font-size: 23px; font-weight: 400; }
      .tangent-label { font-weight: 400; }
      .math { fill: #f3f8f4; font-family: "Liberation Serif", "Times New Roman", serif; font-size: 23px; font-style: italic; font-weight: 400; }
      .small { font-size: 16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e8efe9"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#e8efe9"/>
    </marker>
  </defs>

  <!-- Reference ellipsoid, axis of rotation, and equator. -->
  <ellipse class="line main" cx="270" cy="311" rx="250" ry="202"/>
  <path class="line main" d="M270 69 L270 513"/>
  <path class="line main" d="M20 309 L520 312"/>

  <!-- Geometry:
       p' is on the ellipsoid. The normal at p' passes through p.
       The centre-to-p line gives the geocentric direction. -->
  <circle cx="456" cy="176" r="3.4" fill="#e8efe9"/>
  <circle cx="515" cy="110" r="2.8" fill="#e8efe9"/>
  <path class="line main" d="M270 311 L515 110"/>
  <path class="line main" d="M456 176 L515 110"/>
  <path class="line thin" d="M472 190 L531 124" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <path class="line main" d="M323 310 L456 176"/>
  <path class="line thin" d="M390 117 L568 277"/>
  <path class="line thin" d="M466 166 L476 175 L467 185"/>

  <!-- Parallel displaced double-arrow for r. -->
  <path class="line thin" d="M252 289 L497 88" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>

  <!-- Geocentric latitude angle phi prime, between the equator and centre-to-p line. -->
  <path class="line thin" d="M316 311 A46 46 0 0 0 306 282"/>
  <path class="line thin" d="M362 311 A46 46 0 0 0 352 282"/>

  <!-- Labels. -->
  <text class="label" x="190" y="29">Reference ellipsoid</text>
  <text class="label" x="207" y="58">axis of rotation</text>
  <text class="label" x="216" y="206">Polar</text>
  <text class="label" x="207" y="229">radius</text>
  <text class="math" x="282" y="218">b</text>
  <text class="label" x="83" y="304">Reference ellipsoid</text>
  <text class="label" x="136" y="330">equator</text>
  <text class="math" x="391" y="306">a</text>
  <text class="label" x="323" y="333">equatorial radius</text>
  <text class="math" x="374" y="209">r</text>
  <text class="math" x="449" y="207">p<tspan baseline-shift="super" class="small">′</tspan></text>
  <text class="math" x="525" y="103">p</text>
  <text class="math" x="509" y="164">h</text>
  <text class="label tangent-label" x="543" y="300">Tangent to</text>
  <text class="label tangent-label" x="539" y="324">ellipse at <tspan class="math">p<tspan baseline-shift="super" class="small">′</tspan></tspan></text>
  <text class="math" x="291" y="307">φ<tspan baseline-shift="super" class="small">′</tspan></text>
  <text class="math" x="343" y="304">φ</text>
</svg>
