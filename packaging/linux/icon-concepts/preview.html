<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MARS Lab Icon Concepts</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #63716d;
      --paper: #fff8ec;
      --line: #d8c8ac;
      --glow: rgba(19, 124, 116, 0.16);
    }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 16px/1.5 Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 82, 180, 0.18), transparent 24rem),
        radial-gradient(circle at 82% 20%, rgba(0, 220, 255, 0.2), transparent 24rem),
        linear-gradient(135deg, #fff6df, #eef8ff);
    }
    main {
      max-width: 74rem;
      margin: 0 auto;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: clamp(2rem, 4vw, 4rem);
      letter-spacing: -0.055em;
    }
    p {
      margin: 0 0 1.4rem;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: 1rem;
    }
    h2 {
      margin: 1.8rem 0 0.8rem;
      font: 700 1.1rem/1.2 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    figure {
      margin: 0;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: color-mix(in srgb, var(--paper), white 25%);
      box-shadow: 0 18px 45px var(--glow);
    }
    img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 28px;
    }
    .three-quarter img {
      filter: brightness(1.42) saturate(0.48) contrast(0.72);
    }
    .bold-row img {
      filter: contrast(1.08) saturate(1.05);
    }
    .bold-three-quarter img {
      filter: brightness(1.42) saturate(0.5) contrast(0.82);
    }
    figcaption {
      margin-top: 0.8rem;
      color: var(--muted);
      font: 0.95rem/1.35 system-ui, sans-serif;
    }
    strong {
      display: block;
      color: var(--ink);
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>MARS Lab Icon Concepts</h1>
    <p>Bright mathematical wizardry directions. Pick one and we can make it the desktop icon and browser tab favicon.</p>
    <h2>Bright</h2>
    <div class="grid">
      <figure>
        <img src="wizard-prism.svg" alt="Wizard Prism icon">
        <figcaption><strong>A. Wizard Prism</strong> A neon prism, orbital calculus marks, and a glowing derivative glyph.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron.svg" alt="Arcane Cauldron icon">
        <figcaption><strong>B. Arcane Cauldron</strong> A bright formula cauldron bubbling with π, ∂, and x sparks.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll.svg" alt="Cosmic Scroll icon">
        <figcaption><strong>C. Cosmic Scroll</strong> A parchment spell-card over a cosmic gradient, more scholarly but still vivid.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil.svg" alt="Stellar Sigil icon">
        <figcaption><strong>D. Stellar Sigil</strong> A magical sigil/portal with a clean central ∂x mark for small sizes.</figcaption>
      </figure>
    </div>
    <h2>Three-quarter</h2>
    <div class="grid three-quarter">
      <figure>
        <img src="wizard-prism.svg" alt="Wizard Prism Three-quarter icon">
        <figcaption><strong>A Three-quarter. Wizard Prism</strong> Near-neon prism wizardry, softened one step from the brightest row.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron.svg" alt="Arcane Cauldron Three-quarter icon">
        <figcaption><strong>B Three-quarter. Arcane Cauldron</strong> Still punchy and magical, but a little less midnight-electric.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll.svg" alt="Cosmic Scroll Three-quarter icon">
        <figcaption><strong>C Three-quarter. Cosmic Scroll</strong> Scholarly spell-card colour with most of the original glow retained.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil.svg" alt="Stellar Sigil Three-quarter icon">
        <figcaption><strong>D Three-quarter. Stellar Sigil</strong> The bright sigil dialed down slightly while keeping crisp contrast.</figcaption>
      </figure>
    </div>
    <h2>Halfway</h2>
    <div class="grid">
      <figure>
        <img src="wizard-prism-mid.svg" alt="Wizard Prism Halfway icon">
        <figcaption><strong>A Halfway. Wizard Prism</strong> The same prism spell, lighter than neon but still saturated enough to glow.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron-mid.svg" alt="Arcane Cauldron Halfway icon">
        <figcaption><strong>B Halfway. Arcane Cauldron</strong> A gentler formula cauldron with more punch than the pastel version.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll-mid.svg" alt="Cosmic Scroll Halfway icon">
        <figcaption><strong>C Halfway. Cosmic Scroll</strong> The scholarly spell-card direction with airy but richer cosmic colours.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil-mid.svg" alt="Stellar Sigil Halfway icon">
        <figcaption><strong>D Halfway. Stellar Sigil</strong> The sigil/portal idea in a clear palette that still has magical contrast.</figcaption>
      </figure>
    </div>
    <h2>Light</h2>
    <div class="grid">
      <figure>
        <img src="wizard-prism-light.svg" alt="Wizard Prism Light icon">
        <figcaption><strong>A Light. Wizard Prism</strong> The same prism spell, softened into bright pastel glass and sky colours.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron-light.svg" alt="Arcane Cauldron Light icon">
        <figcaption><strong>B Light. Arcane Cauldron</strong> A gentler formula cauldron with candy-coloured sparks and a lighter pot.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll-light.svg" alt="Cosmic Scroll Light icon">
        <figcaption><strong>C Light. Cosmic Scroll</strong> The scholarly spell-card direction with airy pastel cosmic colours.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil-light.svg" alt="Stellar Sigil Light icon">
        <figcaption><strong>D Light. Stellar Sigil</strong> The sigil/portal idea in a clearer daytime palette for softer desktops.</figcaption>
      </figure>
    </div>
    <h2>Bright Bolder</h2>
    <div class="grid bold-row">
      <figure>
        <img src="wizard-prism-bold.svg" alt="Wizard Prism Bright Bolder icon">
        <figcaption><strong>A Bright Bolder. Wizard Prism</strong> The original neon prism with heavier geometry and a stronger ∂x mark.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron-bold.svg" alt="Arcane Cauldron Bright Bolder icon">
        <figcaption><strong>B Bright Bolder. Arcane Cauldron</strong> A darker cauldron rim and outlined expr text for better small-size reading.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll-bold.svg" alt="Cosmic Scroll Bright Bolder icon">
        <figcaption><strong>C Bright Bolder. Cosmic Scroll</strong> The spell-card gains a darker parchment edge and stronger mathematical lettering.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil-bold.svg" alt="Stellar Sigil Bright Bolder icon">
        <figcaption><strong>D Bright Bolder. Stellar Sigil</strong> A heavier portal/sigil with a larger, more legible central ∂x.</figcaption>
      </figure>
    </div>
    <h2>Three-quarter Bolder</h2>
    <div class="grid bold-three-quarter">
      <figure>
        <img src="wizard-prism-bold.svg" alt="Wizard Prism Three-quarter Bolder icon">
        <figcaption><strong>A Three-quarter Bolder. Wizard Prism</strong> The softened prism palette, but with the stronger edges and text retained.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron-bold.svg" alt="Arcane Cauldron Three-quarter Bolder icon">
        <figcaption><strong>B Three-quarter Bolder. Arcane Cauldron</strong> Less midnight-electric, while preserving the heavier readable expr mark.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll-bold.svg" alt="Cosmic Scroll Three-quarter Bolder icon">
        <figcaption><strong>C Three-quarter Bolder. Cosmic Scroll</strong> A softer cosmic card with the darker outline treatment kept.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil-bold.svg" alt="Stellar Sigil Three-quarter Bolder icon">
        <figcaption><strong>D Three-quarter Bolder. Stellar Sigil</strong> The dialed-down sigil with a central glyph that still reads clearly.</figcaption>
      </figure>
    </div>
    <h2>Halfway Bolder</h2>
    <div class="grid bold-row">
      <figure>
        <img src="wizard-prism-mid-bold.svg" alt="Wizard Prism Halfway Bolder icon">
        <figcaption><strong>A Halfway Bolder. Wizard Prism</strong> Halfway colour with stronger prism boundaries and clearer ∂x text.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron-mid-bold.svg" alt="Arcane Cauldron Halfway Bolder icon">
        <figcaption><strong>B Halfway Bolder. Arcane Cauldron</strong> Gentler colour, sturdier pot shape, and more readable expr lettering.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll-mid-bold.svg" alt="Cosmic Scroll Halfway Bolder icon">
        <figcaption><strong>C Halfway Bolder. Cosmic Scroll</strong> Airier colour with added ink weight for the scroll and formula marks.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil-mid-bold.svg" alt="Stellar Sigil Halfway Bolder icon">
        <figcaption><strong>D Halfway Bolder. Stellar Sigil</strong> Clearer portal rings and central glyph in the mid palette.</figcaption>
      </figure>
    </div>
    <h2>Light Bolder</h2>
    <div class="grid bold-row">
      <figure>
        <img src="wizard-prism-light-bold.svg" alt="Wizard Prism Light Bolder icon">
        <figcaption><strong>A Light Bolder. Wizard Prism</strong> Pastel glass colours with darker prism edges and stronger text.</figcaption>
      </figure>
      <figure>
        <img src="arcane-cauldron-light-bold.svg" alt="Arcane Cauldron Light Bolder icon">
        <figcaption><strong>B Light Bolder. Arcane Cauldron</strong> Candy colours, but with a firmer cauldron outline and legible expr mark.</figcaption>
      </figure>
      <figure>
        <img src="cosmic-scroll-light-bold.svg" alt="Cosmic Scroll Light Bolder icon">
        <figcaption><strong>C Light Bolder. Cosmic Scroll</strong> The daytime spell-card with more ink around the important shapes.</figcaption>
      </figure>
      <figure>
        <img src="stellar-sigil-light-bold.svg" alt="Stellar Sigil Light Bolder icon">
        <figcaption><strong>D Light Bolder. Stellar Sigil</strong> A softer sigil with heavier linework for readability.</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
