<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <title>Sunlit asteroids in deep space</title>
  <desc>Static vector illustration of weathered, irregular rocky bodies with granular regolith, overlapping impact pits and deep fractures. Warm sunlight falls from the upper left. The shapes are decorative rather than portraits of named asteroids.</desc>
  <defs>
    <radialGradient id="stone" cx=".28" cy=".16" r=".88" gradientTransform="translate(0 -.04) scale(1 1.12)">
      <stop stop-color="#c1b5a1"/>
      <stop offset=".28" stop-color="#998d7b"/>
      <stop offset=".56" stop-color="#72685b"/>
      <stop offset=".78" stop-color="#49453e"/>
      <stop offset="1" stop-color="#1c1c1b"/>
    </radialGradient>
    <radialGradient id="hollow" cx=".66" cy=".72" r=".77">
      <stop stop-color="#7e7463"/>
      <stop offset=".5" stop-color="#544d43"/>
      <stop offset=".8" stop-color="#302f2b"/>
      <stop offset="1" stop-color="#1e211f"/>
    </radialGradient>
    <linearGradient id="rim" x1=".18" y1=".1" x2=".72" y2=".9">
      <stop stop-color="#655e52"/>
      <stop offset=".45" stop-color="#887b68"/>
      <stop offset=".8" stop-color="#a4947c"/>
      <stop offset="1" stop-color="#6f6659"/>
    </linearGradient>
    <radialGradient id="shade" cx=".18" cy=".18" r=".95">
      <stop offset=".35" stop-color="#101514" stop-opacity="0"/>
      <stop offset=".67" stop-color="#101514" stop-opacity=".12"/>
      <stop offset=".86" stop-color="#101514" stop-opacity=".45"/>
      <stop offset="1" stop-color="#080b0c" stop-opacity=".9"/>
    </radialGradient>
    <filter id="regolith" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .027" numOctaves="4" seed="9" result="mottle"/>
      <feColorMatrix in="mottle" type="saturate" values="0"/>
      <feComponentTransfer result="mottle">
        <feFuncR type="linear" slope=".45" intercept=".6"/>
        <feFuncG type="linear" slope=".45" intercept=".6"/>
        <feFuncB type="linear" slope=".45" intercept=".6"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="mottle" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="rock"/>
      <feTurbulence type="fractalNoise" baseFrequency=".63" numOctaves="3" seed="23" result="grit"/>
      <feDiffuseLighting in="grit" surfaceScale=".8" diffuseConstant="1" lighting-color="#e3d6bd" result="relief">
        <feDistantLight azimuth="225" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="relief" in2="rock" operator="arithmetic" k1=".6" k2="0" k3=".5" k4="0"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.3"/></filter>
    <path id="long-body" d="M-257-28C-263-47-253-70-236-84C-225-93-222-108-209-117C-192-130-173-130-159-139C-146-146-140-158-119-161C-99-165-83-153-68-142C-48-127-30-122-13-127C9-132 22-153 39-157C63-166 77-163 93-159C108-155 125-159 140-148C157-135 168-139 182-127C193-115 207-117 216-102C226-87 239-85 242-65C245-48 257-36 254-18C251-2 260 12 251 28C245 43 248 60 233 73C221 85 223 101 207 111C191 122 184 137 165 141C143 145 134 159 111 157C93 155 79 167 58 161C39 157 28 139 9 131C-11 123-26 136-43 139C-56 144-68 149-86 140C-103 130-118 133-133 122C-147 112-164 113-177 102C-192 90-209 84-218 68C-227 54-242 49-246 31C-251 10-263-6-257-28Z"/>
    <path id="round-body" d="M-94-21C-96-37-86-46-80-58C-74-69-60-71-50-78C-37-88-25-83-13-89C1-94 12-87 26-85C40-84 45-72 58-68C69-63 70-49 80-41C90-32 84-20 90-7C98 8 90 21 88 34C85 47 74 52 68 64C62 76 47 75 36 82C25 89 12 82-2 87C-17 92-27 83-40 79C-52 75-54 63-66 58C-81 52-77 36-86 26C-96 13-88-4-94-21Z"/>
    <g id="pit">
      <path d="M-24-5C-23-18-11-23 1-22C14-23 25-13 25-2C27 9 16 20 3 21C-12 23-25 12-24-5Z" fill="url(#rim)"/>
      <path d="M-20-5C-18-16-8-20 3-18C16-17 22-9 21 1C20 12 10 17-1 16C-13 15-22 7-20-5Z" fill="url(#hollow)"/>
      <path d="M-20-7C-19-16-7-21 4-18C12-17 18-12 20-7" stroke="#242823" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M-14 14C-3 22 13 17 20 8" stroke="#c9b79b" stroke-opacity=".24" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <g id="boulder">
      <path d="M-7 3L-5-3L0-5L5-2L7 3L3 6L-3 6Z" fill="#443f36"/>
      <path d="M-7 3L-5-3L0-5L2 0L-1 3Z" fill="#b7a68c"/>
      <path d="M2 0L5-2L7 3L3 6L-1 3Z" fill="#716655"/>
    </g>
    <g id="pebble-body">
      <use href="#round-body" fill="url(#stone)" filter="url(#regolith)"/>
      <g opacity=".72">
        <use href="#pit" transform="translate(-19 -28) rotate(-15) scale(.85 .7)"/>
        <use href="#pit" transform="translate(32 22) rotate(20) scale(.5 .65)"/>
        <use href="#pit" transform="translate(-43 25) scale(.3)"/>
        <use href="#pit" transform="translate(24 -45) scale(.25 .35)"/>
      </g>
      <path d="M-62-41Q-43-29-35-9L-23 1L-18 21M-35-9L-16-14" stroke="#322f29" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
      <use href="#round-body" fill="url(#shade)"/>
    </g>
  </defs>
  <g opacity=".72" transform="translate(827 130) rotate(31) scale(.59)">
    <use href="#pebble-body"/>
  </g>
  <g transform="translate(1208 253) rotate(-17)">
